name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only unless a job asks for more (the image job writes packages).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Build & push image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the release tags, for the version
      - id: version
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"
      # arm64 (Apple Silicon, Raspberry Pi, ARM servers): only the native dependencies' install runs emulated.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub too, once the repository variable DOCKERHUB_NAMESPACE (and the secret DOCKERHUB_TOKEN) are set.
      - if: vars.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/ferret
            name=docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/ferret,enable=${{ vars.DOCKERHUB_NAMESPACE != '' }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ !contains(steps.version.outputs.version, '-g') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: FERRET_VERSION=${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Docker Hub's page shows the README and a one-line description. Its images and links are HTML with relative
      # paths, which Docker Hub can't follow, so they're made absolute (GitHub's raw files) first.
      - if: vars.DOCKERHUB_NAMESPACE != ''
        run: |
          sed -E \
            -e 's#(src|srcset)="([^":#]+)"#\1="https://raw.githubusercontent.com/${{ github.repository }}/main/\2"#g' \
            -e 's#href="([^":#]+)"#href="https://github.com/${{ github.repository }}/blob/main/\1"#g' \
            README.md > "$RUNNER_TEMP/README.dockerhub.md"
      - if: vars.DOCKERHUB_NAMESPACE != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          readme-filepath: ${{ runner.temp }}/README.dockerhub.md
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE }}/ferret
          short-description: Find anything you own — a self-hosted home inventory with a REST API and an MCP server.
          enable-url-completion: true
